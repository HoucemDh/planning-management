<nav>
  <a (click)="goBack($event)" href="javascript:void(0)">
    <i class='bx bxs-left-arrow-circle back'></i>
  </a>
  <img src="assets/hikma.png" width="90px">
  <div class="search-container">
    <input
      type="text"
      [(ngModel)]="searchQuery"
      (input)="onSearchInput($event)"
      placeholder="Looking for something..."
      class="search-bar"
      autocomplete="off">
    <button class="search-btn">
      <i class="fas fa-search"></i>
    </button>
  </div>
</nav>

<div class="main">
  <div class="table-container">
    <!-- Error Message -->
    <div *ngIf="error" class="error-message">
      <i class="fas fa-exclamation-circle"></i>
      <p>{{ error }}</p>
    </div>

    <table class="content-table">
      <thead>
        <tr>
          <th *ngFor="let column of columns">
            {{ column }}
            <i class="fas fa-filter filter-icon"
               [class.active]="showFilter[column]"
               (click)="toggleFilter(column, $event)"></i>
            <div *ngIf="showFilter[column]" class="filter-container" (click)="$event.stopPropagation()">
              <input [(ngModel)]="filters[column]" (input)="onFilterChange(column, $event)"
                     class="filter-input" placeholder="Filter..." autocomplete="off"
                     (click)="$event.stopPropagation()">
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="filteredBomData.length === 0">
          <td [attr.colspan]="columns.length" class="no-results">Aucun résultat n'est trouvé</td>
        </tr>
        <tr *ngFor="let h of filteredBomData">
          <td>{{ h.codeproduit }}</td>
          <td>{{ h.BOM_Alternative }}</td>
          <td>{{ h.Categorie_Produit }}</td>
          <td>{{ h.libellesPF }}</td>
          <td>{{ h.taillelot }}</td>
          <td>{{ h.article }}</td>
          <td>{{ h.libellesMP }}</td>
          <td>{{ h.Qte_besoin }}</td>
          <td>{{ h.unite }}</td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination Controls -->
    <div *ngIf="pageInfo && filteredBomData.length > 0" class="pagination-controls">
      <div class="pagination-buttons">
        <button
          [disabled]="!pageInfo.hasPrevious"
          (click)="onPageChange(currentPage - 1)"
          class="page-btn prev-next"
          aria-label="Previous page">
          <i class="fas fa-chevron-left"></i>
        </button>

        <ng-container *ngFor="let page of getVisiblePages()">
          <button
            *ngIf="!isEllipsis(page)"
            [class.active]="getPageNumber(page) === currentPage"
            (click)="onPageChange(getPageNumber(page))"
            class="page-btn">
            {{ getPageNumber(page) + 1 }}
          </button>
          <span *ngIf="isEllipsis(page)" class="ellipsis" aria-hidden="true">...</span>
        </ng-container>

        <button
          [disabled]="!pageInfo.hasNext"
          (click)="onPageChange(currentPage + 1)"
          class="page-btn prev-next"
          aria-label="Next page">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>
