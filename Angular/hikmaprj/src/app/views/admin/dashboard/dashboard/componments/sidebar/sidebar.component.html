<div class="navigation" [ngClass]="{'active': menuCollapsed}">
  <div class="logo-container">
    <img src="assets/hikma.png" alt="Logo" class="logo">
    <span class="logo-text">Hikma</span>
  </div>

  <ul>

    <li class="nav-item" [ngClass]="{'active': activeMenu === 'consultation'}">
      <div class="a" (click)="navigateTo('consultation')">
        <span class="icon">
          <i class='bx bx-table'></i>
        </span>
        <span class="title">Consultation</span>
      </div>
    </li>
    <li class="nav-item" [ngClass]="{'active': activeMenu === 'user-management'}">
      <div class="a" (click)="navigateTo('user-management')" *ngIf="authService.isAdmin()">
          <span class="icon">
              <i class='bx bx-user-circle'></i>
          </span>
          <span class="title">User Management</span>
      </div>
  </li>
    <li class="nav-item" [ngClass]="{'active': activeMenu === 'powerbi'}">
      <div class="a" (click)="navigateTo('powerbi')">
        <span class="icon">
          <i class='bx bx-bar-chart-alt-2'></i>
        </span>
        <span class="title">PowerBI Dashboard</span>
      </div>
    </li>
    <li class="nav-item" [ngClass]="{'active': activeMenu === 'ai-analysis'}">
      <div class="a" (click)="navigateTo('ai-analysis')"*ngIf="authService.isAdmin() || authService.isPlanner()">
        <span class="icon">
          <i class='bx bx-brain'></i>
        </span>
        <span class="title">AI Analysis</span>
      </div>
    </li>

    <li class="nav-divider"><span></span></li>
  <!--
    <li class="nav-item">
      <div class="a" (click)="navigateTo('settings')">
        <span class="icon">
          <i class='bx bx-cog'></i>
        </span>
        <span class="title">Settings</span>
      </div>
    </li>
    <li class="nav-item">
      <div class="a" (click)="navigateTo('help')">
        <span class="icon">
          <i class='bx bx-help-circle'></i>
        </span>
        <span class="title">Help</span>
      </div>
    </li>
    -->
    <li class="nav-item logout">
      <div class="a" (click)="logoutUser()">
        <span class="icon">
          <i class='bx bx-log-out'></i>
        </span>
        <span class="title">Sign Out</span>
      </div>
    </li>
  </ul>
</div>
