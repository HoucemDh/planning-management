<div class="dashboard-container">
  <div class="section-header">
    <h2>User Management Dashboard</h2>
  </div>

  <div class="dashboard-container" *ngIf="authService.isAdmin()">
    <div class="powerbi-container">
      <div class="cardBox">
        <ul class="lists">
          <li class="card">
            <a [routerLink]="['/admin/dashboard/users']" class="nav-link">
              <i class='bx bx-user icon-card'></i>
              <span class="link">Users List</span>
            </a>
          </li>
          <li class="card">
            <a [routerLink]="['/admin/dashboard/roles']" class="nav-link">
              <i class='bx bx-shield-quarter icon-card'></i>
              <span class="link">Roles List</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
