<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<div class="Globalcontainer">
    <div class="container">
        <div class="login-box" [class.error-state]="formError">
            <div class="header">
                <h2>Welcome Back</h2>
                <p>Please login to your account</p>
            </div>
            <form class="login-form" (ngSubmit)="onSubmit()">
                <div class="input-group">
                    <div class="input-field" [class.error]="formError && !email && !username">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required>
                    </div>
                    <div class="input-field" [class.error]="formError && !password">
                        <i class="fas fa-lock"></i>
                        <input [type]="showPassword ? 'text' : 'password'" placeholder="Password" [(ngModel)]="password" name="password" required>
                        <i class="fas" [class.fa-eye]="showPassword" [class.fa-eye-slash]="!showPassword" (click)="togglePasswordVisibility()"></i>
                    </div>
                </div>
                
                <div *ngIf="errorMessage" class="error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{errorMessage}}</span>
                </div>
                
                <button type="submit" class="login-btn" [disabled]="isLoading" [class.loading]="isLoading">
                    <span *ngIf="!isLoading"> Login</span>
                    <span *ngIf="isLoading"> Logging in...</span>
                </button>
            </form>
        </div>
    </div>
</div>
